[package]
name = "tscribe"
version = "0.2.5"
edition = "2024"
rust-version = "1.90"
description = "Transcribe any video/audio URL into agent-friendly markdown using whisper.cpp"
authors = ["Ruben Jongejan <ruben.jongejan@gmail.com>"]
license = "MIT"
repository = "https://github.com/rvben/tscribe"
homepage = "https://github.com/rvben/tscribe"
readme = "README.md"
keywords = ["transcription", "whisper", "yt-dlp", "cli", "speech-to-text"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "tscribe"
path = "src/lib.rs"

[[bin]]
name = "tscribe"
path = "src/main.rs"

[dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sha2 = "0.11"
hex = "0.4"
indicatif = "0.18"
directories = "6"
which = "8"
tempfile = "3"
hound = "3"
jiff = { version = "1.0.2", default-features = false, features = ["std", "serde"] }
futures-util = "0.3"
url = "2.5.9"
clap_complete = "4.6.12"
log = { version = "0.4", features = ["std"] }

[dependencies.whisper-rs]
version = "0.16"
default-features = false
features = ["log_backend"]

[target.'cfg(target_os = "macos")'.dependencies.whisper-rs]
version = "0.16"
default-features = false
features = ["log_backend", "metal"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
